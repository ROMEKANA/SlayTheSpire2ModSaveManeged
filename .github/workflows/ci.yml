name: independent-checks
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Core and Harmony checks
        shell: bash
        run: bash scripts/test.sh
      - name: Setup script checks (fixture files only)
        shell: pwsh
        run: ./tests/Setup.Tests.ps1
      - name: Workshop scripts (fixtures only; no upload)
        shell: pwsh
        run: ./tests/Workshop.Tests.ps1
      - name: Windows PowerShell 5.1 Workshop fixtures
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/Workshop.Tests.ps1
